<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My To-Do List</title>

    <style>

        /* Remove default spacing */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        /* Page */

        body {
            font-family: Arial, sans-serif;

            background-color: #111827;

            color: white;

            min-height: 100vh;

            padding: 40px 20px;
        }


        /* Main container */

        .container {
            width: 100%;
            max-width: 650px;

            margin: auto;

            background-color: #1f2937;

            padding: 30px;

            border-radius: 12px;

            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }


        /* Heading */

        h1 {
            text-align: center;

            color: #00d9ff;

            margin-bottom: 25px;
        }


        /* Add task area */

        .add-task {
            display: flex;

            gap: 10px;

            margin-bottom: 20px;
        }


        /* Input boxes */

        input {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 6px;

            font-size: 16px;

            outline: none;
        }


        /* Add button */

        #addButton {
            padding: 13px 20px;

            border: none;

            border-radius: 6px;

            background-color: #00d9ff;

            color: #111827;

            font-weight: bold;

            cursor: pointer;

            white-space: nowrap;
        }


        #addButton:hover {
            background-color: white;
        }


        /* Search */

        #searchInput {
            margin-bottom: 20px;
        }


        /* Filter buttons */

        .filters {
            display: flex;

            justify-content: center;

            gap: 10px;

            margin-bottom: 20px;
        }


        .filters button {
            padding: 9px 15px;

            border: none;

            border-radius: 5px;

            cursor: pointer;

            background-color: white;

            color: #111827;
        }


        .filters button:hover {
            background-color: #00d9ff;
        }


        /* Task list */

        #taskList {
            list-style: none;
        }


        /* Individual task */

        .task {
            display: flex;

            align-items: center;

            justify-content: space-between;

            background-color: #374151;

            padding: 13px;

            margin-bottom: 10px;

            border-radius: 6px;

            gap: 10px;
        }


        /* Task text */

        .task-text {
            flex: 1;

            cursor: pointer;

            word-break: break-word;
        }


        /* Completed task */

        .completed {
            text-decoration: line-through;

            opacity: 0.5;
        }


        /* Edit and Delete buttons */

        .task-buttons {
            display: flex;

            gap: 5px;
        }


        .task-buttons button {
            padding: 6px 10px;

            border: none;

            border-radius: 4px;

            cursor: pointer;
        }


        .edit-button {
            background-color: #facc15;
        }


        .delete-button {
            background-color: #ef4444;

            color: white;
        }


        /* Count */

        .count {
            display: flex;

            justify-content: space-around;

            margin-top: 25px;

            padding-top: 20px;

            border-top: 1px solid #555;
        }


        /* Mobile */

        @media (max-width: 600px) {

            .container {
                padding: 20px;
            }


            .add-task {
                flex-direction: column;
            }


            #addButton {
                width: 100%;
            }


            .task {
                flex-direction: column;

                align-items: stretch;
            }


            .task-buttons {
                justify-content: flex-end;
            }


            .filters {
                flex-wrap: wrap;
            }

        }

    </style>

</head>


<body>

    <div class="container">

        <h1>My To-Do List</h1>


        <!-- Add Task -->

        <div class="add-task">

            <input
                type="text"
                id="taskInput"
                placeholder="Enter your task..."
            >

            <button id="addButton">
                Add Task
            </button>

        </div>


        <!-- Search -->

        <input
            type="text"
            id="searchInput"
            placeholder="Search your tasks..."
        >


        <!-- Filter Buttons -->

        <div class="filters">

            <button id="allButton">
                All
            </button>

            <button id="pendingButton">
                Pending
            </button>

            <button id="completedButton">
                Completed
            </button>

        </div>


        <!-- Task List -->

        <ul id="taskList"></ul>


        <!-- Task Count -->

        <div class="count">

            <p>
                Completed:
                <span id="completedCount">0</span>
            </p>

            <p>
                Pending:
                <span id="pendingCount">0</span>
            </p>

        </div>

    </div>


    <script>

        // Get saved tasks from Local Storage

        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];


        // Get HTML elements

        const taskInput = document.getElementById("taskInput");

        const addButton = document.getElementById("addButton");

        const taskList = document.getElementById("taskList");

        const searchInput = document.getElementById("searchInput");

        const completedCount = document.getElementById("completedCount");

        const pendingCount = document.getElementById("pendingCount");


        // Current filter

        let currentFilter = "all";


        // Display tasks when website opens

        displayTasks();


        // Add task when Add button is clicked

        addButton.addEventListener("click", function () {

            addTask();

        });


        // Add task when Enter key is pressed

        taskInput.addEventListener("keydown", function (event) {

            if (event.key === "Enter") {

                addTask();

            }

        });


        // Function to add a task

        function addTask() {

            // Get the text entered by user

            const text = taskInput.value.trim();


            // Check if input is empty

            if (text === "") {

                alert("Please enter a task.");

                return;

            }


            // Create a new task

            const newTask = {

                id: Date.now(),

                text: text,

                completed: false

            };


            // Add task to array

            tasks.push(newTask);


            // Save task

            saveTasks();


            // Clear input box

            taskInput.value = "";


            // Show tasks

            displayTasks();


            // Put cursor back in input box

            taskInput.focus();

        }


        // Function to display tasks

        function displayTasks() {

            // Clear old tasks

            taskList.innerHTML = "";


            // Get search text

            const searchText = searchInput.value
                .toLowerCase()
                .trim();


            // Filter tasks

            let filteredTasks = tasks.filter(function (task) {

                // Search filter

                const matchesSearch =
                    task.text.toLowerCase().includes(searchText);


                // Status filter

                let matchesFilter = true;


                if (currentFilter === "pending") {

                    matchesFilter = task.completed === false;

                }


                if (currentFilter === "completed") {

                    matchesFilter = task.completed === true;

                }


                return matchesSearch && matchesFilter;

            });


            // Display each task

            filteredTasks.forEach(function (task) {

                // Create list item

                const li = document.createElement("li");

                li.className = "task";


                // Create task text

                const span = document.createElement("span");

                span.textContent = task.text;

                span.className = "task-text";


                // If task is completed

                if (task.completed) {

                    span.classList.add("completed");

                }


                // Click task to complete

                span.addEventListener("click", function () {

                    toggleTask(task.id);

                });


                // Create button container

                const buttonContainer =
                    document.createElement("div");

                buttonContainer.className = "task-buttons";


                // Create Edit button

                const editButton =
                    document.createElement("button");

                editButton.textContent = "Edit";

                editButton.className = "edit-button";


                editButton.addEventListener("click", function () {

                    editTask(task.id);

                });


                // Create Delete button

                const deleteButton =
                    document.createElement("button");

                deleteButton.textContent = "Delete";

                deleteButton.className = "delete-button";


                deleteButton.addEventListener("click", function () {

                    deleteTask(task.id);

                });


                // Add buttons

                buttonContainer.appendChild(editButton);

                buttonContainer.appendChild(deleteButton);


                // Add text and buttons to task

                li.appendChild(span);

                li.appendChild(buttonContainer);


                // Add task to list

                taskList.appendChild(li);

            });


            // Update counts

            updateCount();

        }


        // Complete or pending task

        function toggleTask(id) {

            tasks = tasks.map(function (task) {

                if (task.id === id) {

                    task.completed = !task.completed;

                }

                return task;

            });


            saveTasks();

            displayTasks();

        }


        // Edit task

        function editTask(id) {

            const task = tasks.find(function (task) {

                return task.id === id;

            });


            const newText = prompt(
                "Edit your task:",
                task.text
            );


            if (
                newText !== null &&
                newText.trim() !== ""
            ) {

                task.text = newText.trim();

                saveTasks();

                displayTasks();

            }

        }


        // Delete task

        function deleteTask(id) {

            const confirmDelete =
                confirm("Do you want to delete this task?");


            if (!confirmDelete) {

                return;

            }


            tasks = tasks.filter(function (task) {

                return task.id !== id;

            });


            saveTasks();

            displayTasks();

        }


        // Save tasks in Local Storage

        function saveTasks() {

            localStorage.setItem(
                "tasks",
                JSON.stringify(tasks)
            );

        }


        // Update completed and pending count

        function updateCount() {

            let completed = 0;

            let pending = 0;


            tasks.forEach(function (task) {

                if (task.completed) {

                    completed++;

                } else {

                    pending++;

                }

            });


            completedCount.textContent = completed;

            pendingCount.textContent = pending;

        }


        // Search tasks

        searchInput.addEventListener("input", function () {

            displayTasks();

        });


        // All button

        document.getElementById("allButton")
            .addEventListener("click", function () {

                currentFilter = "all";

                displayTasks();

            });


        // Pending button

        document.getElementById("pendingButton")
            .addEventListener("click", function () {

                currentFilter = "pending";

                displayTasks();

            });


        // Completed button

        document.getElementById("completedButton")
            .addEventListener("click", function () {

                currentFilter = "completed";

                displayTasks();

            });

    </script>

</body>

</html>
