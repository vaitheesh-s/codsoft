<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - To-Do List</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="app">

        <!-- Header -->
        <header class="header">
            <div>
                <h1>TaskFlow</h1>
                <p>Organize your day. Get things done.</p>
            </div>

            <button id="themeBtn" class="theme-btn" title="Toggle dark mode">
                🌙
            </button>
        </header>

        <!-- Statistics -->
        <section class="stats">

            <div class="stat-card">
                <span class="stat-icon">📋</span>
                <div>
                    <h3 id="totalTasks">0</h3>
                    <p>Total Tasks</p>
                </div>
            </div>

            <div class="stat-card">
                <span class="stat-icon">⏳</span>
                <div>
                    <h3 id="pendingTasks">0</h3>
                    <p>Pending</p>
                </div>
            </div>

            <div class="stat-card">
                <span class="stat-icon">✅</span>
                <div>
                    <h3 id="completedTasks">0</h3>
                    <p>Completed</p>
                </div>
            </div>

        </section>

        <!-- Add Task -->
        <section class="task-form-container">

            <h2>Add New Task</h2>

            <form id="taskForm">

                <div class="input-group">
                    <label for="taskTitle">Task</label>
                    <input
                        type="text"
                        id="taskTitle"
                        placeholder="What do you need to do?"
                        maxlength="100"
                        required
                    >
                </div>

                <div class="form-row">

                    <div class="input-group">
                        <label for="category">Category</label>

                        <select id="category">
                            <option value="Personal">Personal</option>
                            <option value="Study">Study</option>
                            <option value="Work">Work</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="priority">Priority</label>

                        <select id="priority">
                            <option value="Low">Low</option>
                            <option value="Medium" selected>Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>

                    <div class="input-group">
                        <label for="dueDate">Due Date</label>
                        <input type="date" id="dueDate">
                    </div>

                </div>

                <button type="submit" class="add-btn">
                    + Add Task
                </button>

            </form>

        </section>

        <!-- Controls -->
        <section class="controls">

            <div class="search-box">
                <span>🔍</span>

                <input
                    type="text"
                    id="searchInput"
                    placeholder="Search tasks..."
                >
            </div>

            <div class="filter-buttons">

                <button class="filter-btn active" data-filter="all">
                    All
                </button>

                <button class="filter-btn" data-filter="pending">
                    Pending
                </button>

                <button class="filter-btn" data-filter="completed">
                    Completed
                </button>

            </div>

        </section>

        <!-- Task List -->
        <section class="task-section">

            <div id="taskList"></div>

            <div id="emptyState" class="empty-state">
                <div class="empty-icon">📝</div>

                <h3>No tasks found</h3>

                <p>
                    Add a new task to start organizing your day.
                </p>
            </div>

        </section>

        <!-- Footer -->
        <footer>
            <p>TaskFlow &copy; 2026 | Stay productive 🚀</p>
        </footer>

    </div>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
